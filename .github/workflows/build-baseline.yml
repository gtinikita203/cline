name: Build Baseline CLI

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  build-linux-x64:
    name: Build cline-linux-x64-baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Build platform binaries (Linux x64 Baseline)
        run: bun script/build.ts --single --skip-sdk-build
        working-directory: apps/cli

      - name: Verify build output
        run: |
          ls -lh apps/cli/dist/cli-linux-x64/bin/cline

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-linux-x64-baseline
          path: apps/cli/dist/cli-linux-x64/bin/cline
